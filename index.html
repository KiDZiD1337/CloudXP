<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudXP</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #121212; color: #ffffff; margin: 0; padding: 0; min-height: 100vh; overflow: hidden; }
    
    .login-container { text-align: center; background: #1e1e1e; padding: 2.5rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); max-width: 400px; width: 90%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 100; }

    .map-viewport { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; overflow: hidden; background: #121212; cursor: grab; }
    .map-viewport:active { cursor: grabbing; }

    .map-container { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
    .map-image { display: block; max-width: none; user-select: none; pointer-events: none; min-width: 800px; min-height: 600px; }

    .map-node-interactive { position: absolute; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: black; border: 2px solid #ffffff; transform: translate(-50%, -50%); cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.8); z-index: 4; transition: transform 0.2s, box-shadow 0.2s; }
    .map-node-interactive:hover { transform: translate(-50%, -50%) scale(1.25); z-index: 10; }
    
    .map-node-interactive.type-standard { background: #ffeb3b; }
    .map-node-interactive.type-branch { background: #2196f3; color: white; }
    .map-node-interactive.type-shop { background: #4caf50; color: white; }
    .map-node-interactive.type-gate { background: #f44336; color: white; }
    .map-node-interactive.is-current { animation: pulse 1.5s infinite alternate; }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 152, 0, 0.8); }
      100% { box-shadow: 0 0 0 12px rgba(255, 152, 0, 0); }
    }

    .map-controls { position: absolute; bottom: 1.5rem; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 8px; background: rgba(30,30,30,0.85); padding: 6px 12px; border-radius: 20px; backdrop-filter: blur(4px); border: 1px solid #444; }
    .map-controls button { background: #333; color: white; border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
    .map-controls button:hover { background: #444; }

    .cloudie-marker { position: absolute; width: 36px; height: 36px; background: #ff9800; border: 3px solid #ffffff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; transform: translate(-50%, -100%); box-shadow: 0 4px 10px rgba(0,0,0,0.8); z-index: 6; animation: bounce 1.5s infinite alternate; pointer-events: none; }
    .cloudie-name { position: absolute; top: -20px; background: rgba(0,0,0,0.8); color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; white-space: nowrap; }

    @keyframes bounce {
      0% { transform: translate(-50%, -100%); }
      100% { transform: translate(-50%, -115%); }
    }

    .viewport-overlay { display: none; width: 100vw; height: 100vh; position: relative; z-index: 2; pointer-events: none; }
    .card { background: rgba(30, 30, 30, 0.92); backdrop-filter: blur(8px); padding: 1.2rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.7); border: 1px solid #333; pointer-events: auto; }

    .profile-widget { position: absolute; top: 1rem; left: 1rem; width: 360px; max-height: calc(100vh - 2rem); overflow-y: auto; }
    .leaderboard-widget { position: absolute; bottom: 1rem; right: 1rem; width: 320px; max-height: 480px; overflow-y: auto; }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.75); backdrop-filter: blur(4px); z-index: 200; align-items: center; justify-content: center; }
    .modal-card { background: #1e1e1e; padding: 1.8rem; border-radius: 12px; border: 1px solid #444; max-width: 420px; width: 90%; box-shadow: 0 8px 32px rgba(0,0,0,0.8); text-align: center; }
    .modal-card h3 { margin-top: 0; color: #ff9800; font-size: 20px; }
    .modal-card p { font-size: 14px; color: #ccc; margin-bottom: 1.5rem; }
    .modal-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

    @media (max-width: 820px) {
      body { overflow-y: auto; }
      .map-viewport { position: relative; height: 400px; }
      .viewport-overlay { display: flex; flex-direction: column; gap: 1rem; position: static; padding: 1rem; height: auto; pointer-events: auto; }
      .profile-widget, .leaderboard-widget { position: static; width: 100%; max-height: none; }
    }

    button.primary-btn { background-color: #4285F4; color: white; border: none; padding: 10px 18px; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
    button.primary-btn:hover { background-color: #357ae8; }
    
    .stats-bar { display: flex; justify-content: space-around; background: #2a2a2a; padding: 10px; border-radius: 8px; margin-top: 0.8rem; font-weight: bold; font-size: 13px; text-align: center; }
    
    .xp-progress-container { margin-top: 0.8rem; }
    .xp-text { font-size: 11px; color: #aaa; margin-bottom: 4px; display: flex; justify-content: space-between; }
    .xp-bar-bg { background: #2a2a2a; height: 8px; border-radius: 4px; overflow: hidden; width: 100%; }
    .xp-bar-fill { background: linear-gradient(90deg, #ff9800, #ffeb3b); height: 100%; width: 0%; transition: width 0.4s ease; }

    .inventory-box { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; font-size: 11px; }
    .inventory-item { background: #4a148c; color: white; padding: 4px 8px; border-radius: 12px; font-weight: bold; }

    .leaderboard-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 6px; margin-bottom: 8px; }
    .leaderboard-header h3 { margin: 0; font-size: 15px; color: #ff9800; }
    .tab-container { display: flex; gap: 4px; margin-bottom: 10px; }
    .tab-btn { background: #2a2a2a; color: #aaa; border: none; padding: 6px 8px; font-size: 11px; border-radius: 4px; cursor: pointer; flex: 1; text-align: center; }
    .tab-btn.active { background: #388e3c; color: white; font-weight: bold; }

    .member-item { display: flex; justify-content: space-between; font-size: 12px; padding: 6px 0; border-bottom: 1px solid #333; }
    .member-item:last-child { border-bottom: none; }
    
    .household-form { display: flex; gap: 6px; margin-top: 8px; }
    .household-form input { flex: 1; padding: 6px 8px; border-radius: 4px; border: 1px solid #444; background: #1e1e1e; color: white; font-size: 11px; }
    .household-form button { padding: 6px 10px; font-size: 11px; background-color: #388e3c; }

    .habit-list { margin-top: 1rem; }
    .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #ff9800; margin-top: 1rem; margin-bottom: 0.4rem; font-weight: bold; }
    .habit-item { background: #2a2a2a; padding: 10px; border-radius: 6px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    .complete-btn { background-color: #2e7d32; font-size: 11px; padding: 5px 10px; border: none; color: white; border-radius: 4px; cursor: pointer; }
    .complete-btn:hover { background-color: #1b5e20; }
    .disabled-btn { background-color: #444; color: #888; cursor: not-allowed; }
    .disabled-btn:hover { background-color: #444; }
    
    .admin-btn { display: none; background-color: #7b1fa2; margin-top: 1rem; width: 100%; border: none; color: white; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .admin-btn:hover { background-color: #6a1b9a; }
  </style>
</head>
<body>

  <div id="login-card" class="login-container">
    <h1>CloudXP 🎮</h1>
    <p>Logga in för att påbörja ditt äventyr.</p>
    <button id="login-btn" class="primary-btn">Logga in med Google</button>
  </div>

  <div id="map-viewport" class="map-viewport" style="display: none;">
    <div class="map-container" id="map-container">
      <img id="active-map-img" class="map-image" src="" alt="Månadens Karta">
      <div id="nodes-layer"></div>
      <div id="cloudie-overlay"></div>
    </div>
    
    <div class="map-controls">
      <button onclick="zoomMap(0.15)">＋</button>
      <button onclick="zoomMap(-0.15)">－</button>
      <button onclick="resetMapView()">🎯</button>
    </div>
  </div>

  <div id="node-modal" class="modal-overlay">
    <div class="modal-card">
      <h3 id="modal-title">Nod 1</h3>
      <p id="modal-desc">Beskrivning...</p>
      <div id="modal-actions" class="modal-actions"></div>
    </div>
  </div>

  <div id="dashboard" class="viewport-overlay">
    
    <div class="card profile-widget">
      <h2 id="user-name" style="margin: 0 0 4px 0; font-size: 18px;">Välkommen!</h2>
      
      <div class="stats-bar">
        <span>⭐ Lvl <span id="user-level">1</span></span>
        <span>🔥 <span id="user-streak">0</span> Dagar</span>
        <span>💰 <span id="user-coins">0</span> Coins</span>
      </div>

      <div class="xp-progress-container">
        <div class="xp-text">
          <span>Progress till Lvl <span id="next-level">2</span></span>
          <span><span id="user-xp">0</span> / <span id="target-xp">100</span> XP</span>
        </div>
        <div class="xp-bar-bg">
          <div id="xp-fill" class="xp-bar-fill"></div>
        </div>
      </div>

      <div style="margin-top: 10px;">
        <span style="font-size: 11px; color: #aaa;">🎒 Ditt Inventarie:</span>
        <div id="user-inventory" class="inventory-box">Inga prylar ännu.</div>
      </div>

      <div class="habit-list">
        <div id="habits-container">Laddar utmaningar...</div>
      </div>

      <button id="admin-link-btn" class="admin-btn" onclick="window.location.href='admin.html'">⚙️ Admin Panel</button>
      <button id="logout-btn" style="background-color: #e53935; margin-top: 1rem; width: 100%; border: none; color: white; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold;">Logga ut</button>
    </div>

    <div class="card leaderboard-widget">
      <div class="leaderboard-header">
        <h3>🏆 Leaderboard</h3>
        <span id="invite-code-display" style="font-size: 10px; color: #aaa;"></span>
      </div>

      <div class="tab-container">
        <button id="tab-house-btn" class="tab-btn active" onclick="switchLeaderboardTab('house')">🏠 Hem</button>
        <button id="tab-global-users-btn" class="tab-btn" onclick="switchLeaderboardTab('global-users')">🌍 Spelare</button>
        <button id="tab-global-houses-btn" class="tab-btn" onclick="switchLeaderboardTab('global-houses')">🏘️ Hem-rank</button>
      </div>

      <div id="leaderboard-content">
        Laddar topplista...
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = 'https://phhglvauynccbcpdnjqw.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_ASdxmwP7tzMXRtprVoaM2w_1maNYHQG'; 

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentUser = null;
    let currentUserProfile = null;
    let activeTab = 'house';
    let currentMapNodes = [];

    let scale = 1;
    let minScale = 1;
    let panX = 0;
    let panY = 0;
    let isDragging = false;
    let startX, startY;

    document.getElementById('login-btn').addEventListener('click', async () => {
      const { error } = await db.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin }
      });
      if (error) alert('Fel: ' + error.message);
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await db.auth.signOut();
      window.location.reload();
    });

    function initMapPanZoom() {
      const viewport = document.getElementById('map-viewport');

      viewport.addEventListener('mousedown', (e) => {
        if (e.target.closest('.card') || e.target.closest('.map-controls') || e.target.closest('.modal-card')) return;
        isDragging = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        clampPanAndApply();
      });

      window.addEventListener('mouseup', () => { isDragging = false; });

      viewport.addEventListener('wheel', (e) => {
        e.preventDefault();
        const delta = e.deltaY < 0 ? 0.08 : -0.08;
        zoomMap(delta);
      }, { passive: false });

      window.addEventListener('resize', () => {
        calculateMinScale();
        clampPanAndApply();
      });
    }

    function calculateMinScale() {
      const img = document.getElementById('active-map-img');
      const w = img.naturalWidth || 1920;
      const h = img.naturalHeight || 1080;

      const scaleX = window.innerWidth / w;
      const scaleY = window.innerHeight / h;
      minScale = Math.max(scaleX, scaleY);
      if (scale < minScale) scale = minScale;
    }

    function zoomMap(amount) {
      calculateMinScale();
      scale = Math.min(Math.max(minScale, scale + amount), 3.0);
      clampPanAndApply();
    }

    function resetMapView() {
      calculateMinScale();
      scale = minScale;
      const img = document.getElementById('active-map-img');
      const w = img.naturalWidth || 1920;
      const h = img.naturalHeight || 1080;

      const mapWidth = w * scale;
      const mapHeight = h * scale;

      panX = (window.innerWidth - mapWidth) / 2;
      panY = (window.innerHeight - mapHeight) / 2;
      clampPanAndApply();
    }

    function clampPanAndApply() {
      const img = document.getElementById('active-map-img');
      const w = img.naturalWidth || 1920;
      const h = img.naturalHeight || 1080;

      const mapWidth = w * scale;
      const mapHeight = h * scale;

      const minPanX = window.innerWidth - mapWidth;
      const minPanY = window.innerHeight - mapHeight;

      panX = Math.min(0, Math.max(minPanX, panX));
      panY = Math.min(0, Math.max(minPanY, panY));

      const container = document.getElementById('map-container');
      container.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    function updateXpBar(xp, level) {
      const currentLevelBaseXp = (level - 1) * 100;
      const nextLevelXp = level * 100;
      const xpInCurrentLevel = xp - currentLevelBaseXp;
      const percentage = Math.min(100, Math.max(0, (xpInCurrentLevel / 100) * 100));

      document.getElementById('user-xp').innerText = xp;
      document.getElementById('user-level').innerText = level;
      document.getElementById('next-level').innerText = level + 1;
      document.getElementById('target-xp').innerText = nextLevelXp;
      document.getElementById('xp-fill').style.width = percentage + '%';
    }

    function renderInventory(inv) {
      const box = document.getElementById('user-inventory');
      if (!inv || inv.length === 0) {
        box.innerHTML = '<span style="color:#888;">Inga prylar ännu.</span>';
        return;
      }
      box.innerHTML = inv.map(i => `<span class="inventory-item">🎁 ${i}</span>`).join('');
    }

    async function loadActiveMapAndPosition(userNode) {
      const monthKey = '2026-08';
      const { data: mapData } = await db.from('active_map').select('*').eq('month_key', monthKey).maybeSingle();

      const img = document.getElementById('active-map-img');

      if (mapData && mapData.image_url) {
        currentMapNodes = mapData.nodes_json || [];

        img.onload = () => {
          renderNodesOnMap();
          renderCloudieOnNode(userNode);
          resetMapView();
        };

        img.onerror = () => {
          renderNodesOnMap();
          renderCloudieOnNode(userNode);
          resetMapView();
        };

        img.src = mapData.image_url;
      } else {
        renderNodesOnMap();
        renderCloudieOnNode(userNode);
      }
    }

    function renderNodesOnMap() {
      const layer = document.getElementById('nodes-layer');
      layer.innerHTML = '';

      currentMapNodes.forEach(n => {
        const pin = document.createElement('div');
        const isCurrent = currentUserProfile && currentUserProfile.map_node === n.node;
        pin.className = `map-node-interactive type-${n.type || 'standard'} ${isCurrent ? 'is-current' : ''}`;
        pin.style.left = `${n.x}%`;
        pin.style.top = `${n.y}%`;
        pin.innerText = n.node;
        pin.onclick = (e) => {
          e.stopPropagation();
          handleNodeClick(n);
        };
        layer.appendChild(pin);
      });
    }

    function renderCloudieOnNode(nodeNum) {
      const overlay = document.getElementById('cloudie-overlay');
      overlay.innerHTML = '';

      if (!currentMapNodes || currentMapNodes.length === 0) return;

      const targetNode = currentMapNodes.find(n => n.node === nodeNum) || currentMapNodes[0];

      if (targetNode) {
        const marker = document.createElement('div');
        marker.className = 'cloudie-marker';
        marker.style.left = `${targetNode.x}%`;
        marker.style.top = `${targetNode.y}%`;
        marker.innerHTML = `<div class="cloudie-name">Du (Nod ${nodeNum})</div>☁️`;
        overlay.appendChild(marker);
      }
    }

    function handleNodeClick(node) {
      const modal = document.getElementById('node-modal');
      const title = document.getElementById('modal-title');
      const desc = document.getElementById('modal-desc');
      const actions = document.getElementById('modal-actions');

      const userNode = currentUserProfile ? currentUserProfile.map_node : 1;
      const userXp = currentUserProfile ? currentUserProfile.current_month_xp : 0;
      const inventory = currentUserProfile ? (currentUserProfile.inventory || []) : [];

      title.innerText = `📍 Nod ${node.node} (${node.type ? node.type.toUpperCase() : 'STANDARD'})`;
      actions.innerHTML = '';

      // Steg 1: Om spelaren inte står på denna nod än, erbjud möjlighet att flytta hit först
      if (userNode !== node.node) {
        const canReach = userXp >= (node.required_xp || 0);

        if (canReach) {
          desc.innerText = `Du står på Nod ${userNode}. Vill du förflytta din avatar till Nod ${node.node}? (Kräver ${node.required_xp || 0} XP, du har ${userXp} XP)`;
          
          const moveBtn = document.createElement('button');
          moveBtn.className = 'primary-btn';
          moveBtn.innerText = `Flytta till Nod ${node.node} 🏃‍♂️`;
          moveBtn.onclick = () => moveToNode(node.node);
          actions.appendChild(moveBtn);
        } else {
          desc.innerText = `🔒 Du kan inte flytta hit ännu. Nod ${node.node} kräver ${node.required_xp || 0} XP (du har ${userXp} XP).`;
        }
      } 
      // Steg 2: Om spelaren FAKTISKT STÅR på denna nod, hantera nodens specifika händelse
      else {
        if (node.type === 'shop') {
          desc.innerText = `Välkommen till butiken! Här kan du köpa "${node.shop_item_name || 'Okänd pryl'}" för ${node.shop_item_cost || 100} Coins.`;
          
          const buyBtn = document.createElement('button');
          buyBtn.className = 'primary-btn';
          buyBtn.innerText = `Köp för ${node.shop_item_cost || 100} 💰`;
          buyBtn.onclick = () => executeBuyItem(node.shop_item_name, node.shop_item_cost);
          actions.appendChild(buyBtn);

        } else if (node.type === 'branch') {
          desc.innerText = `You have come to a fork in the road. Choose wisely.`;
          
          (node.next_nodes || []).forEach(nextId => {
            const btn = document.createElement('button');
            btn.className = 'primary-btn';
            btn.innerText = `Gå vidare till Nod ${nextId} ➡️`;
            btn.onclick = () => moveToNode(nextId);
            actions.appendChild(btn);
          });

        } else if (node.type === 'gate') {
          const hasItem = inventory.includes(node.required_item);
          if (hasItem) {
            desc.innerText = `Porten kräver "${node.required_item}". Du har föremålet i ditt inventarie!`;
            (node.next_nodes || []).forEach(nextId => {
              const unlockBtn = document.createElement('button');
              unlockBtn.className = 'primary-btn';
              unlockBtn.innerText = `Lås upp & Gå till Nod ${nextId} 🔑`;
              unlockBtn.onclick = () => moveToNode(nextId);
              actions.appendChild(unlockBtn);
            });
          } else {
            desc.innerText = `🔒 Porten är låst! Du behöver föremålet "${node.required_item}" i ditt inventarie för att passera här.`;
          }

        } else {
          desc.innerText = `Du befinner dig på Nod ${node.node}. Du har samlat ihop tillräckligt med XP och kan röra dig vidare när du är redo.`;
        }
      }

      const closeBtn = document.createElement('button');
      closeBtn.style.background = '#444';
      closeBtn.style.color = '#fff';
      closeBtn.style.border = 'none';
      closeBtn.style.padding = '8px 16px';
      closeBtn.style.borderRadius = '6px';
      closeBtn.style.cursor = 'pointer';
      closeBtn.innerText = 'Stäng';
      closeBtn.onclick = () => { modal.style.display = 'none'; };
      actions.appendChild(closeBtn);

      modal.style.display = 'flex';
    }

    async function executeBuyItem(itemName, cost) {
      const { data, error } = await db.rpc('buy_shop_item', { p_item_name: itemName, p_cost: cost });
      if (error) {
        alert('Köp misslyckades: ' + error.message);
      } else {
        alert(`Grattis! Du köpte ${itemName}! 🎉`);
        currentUserProfile.coins = data.coins;
        currentUserProfile.inventory = data.inventory;
        document.getElementById('user-coins').innerText = data.coins;
        renderInventory(data.inventory);
        document.getElementById('node-modal').style.display = 'none';
      }
    }

    async function moveToNode(newNodeId) {
      const { error } = await db.from('profiles').update({ map_node: newNodeId }).eq('id', currentUser.id);
      if (error) {
        alert('Kunde inte flytta: ' + error.message);
      } else {
        currentUserProfile.map_node = newNodeId;
        renderNodesOnMap();
        renderCloudieOnNode(newNodeId);
        document.getElementById('node-modal').style.display = 'none';

        const targetNode = currentMapNodes.find(n => n.node === newNodeId);
        if (targetNode) {
          handleNodeClick(targetNode);
        }
      }
    }

    function switchLeaderboardTab(tab) {
      activeTab = tab;
      document.getElementById('tab-house-btn').classList.toggle('active', tab === 'house');
      document.getElementById('tab-global-users-btn').classList.toggle('active', tab === 'global-users');
      document.getElementById('tab-global-houses-btn').classList.toggle('active', tab === 'global-houses');

      renderLeaderboard();
    }

    async function renderLeaderboard() {
      const content = document.getElementById('leaderboard-content');
      const codeDisplay = document.getElementById('invite-code-display');

      if (activeTab === 'house') {
        const { data: member } = await db.from('household_members').select('household_id').eq('user_id', currentUser.id).maybeSingle();

        if (!member) {
          codeDisplay.innerText = '';
          content.innerHTML = `
            <p style="font-size: 11px; color: #aaa;">Du tillhör inget hem ännu.</p>
            <div class="household-form">
              <input type="text" id="new-house-name" placeholder="Skapa hem (namn)">
              <button onclick="createHouse()">Skapa</button>
            </div>
            <div class="household-form">
              <input type="text" id="join-house-code" placeholder="Gå med (kod)">
              <button onclick="joinHouse()" style="background-color: #1565c0;">Gå med</button>
            </div>
          `;
          return;
        }

        const { data: house } = await db.from('households').select('*').eq('id', member.household_id).single();
        codeDisplay.innerText = `Kod: ${house.invite_code}`;

        const { data: members } = await db.from('household_members').select('user_id').eq('household_id', house.id);
        const { data: profiles } = await db.from('profiles').select('id, full_name, level, xp');

        let html = `<strong style="font-size: 12px; color: #388e3c;">${house.name}</strong><div style="margin-top: 4px;">`;
        if (members && profiles) {
          const memberProfiles = members.map(m => profiles.find(p => p.id === m.user_id)).filter(Boolean);
          memberProfiles.sort((a, b) => (b.xp || 0) - (a.xp || 0));

          memberProfiles.forEach((p, idx) => {
            const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `${idx + 1}.`;
            html += `
              <div class="member-item">
                <span>${medal} ${p.full_name || 'Anonym'}</span>
                <span>⭐ Lvl ${p.level || 1} (${p.xp || 0} XP)</span>
              </div>
            `;
          });
        }
        html += '</div>';
        content.innerHTML = html;

      } else if (activeTab === 'global-users') {
        codeDisplay.innerText = '';
        const { data: topProfiles } = await db.from('profiles').select('full_name, level, xp').order('xp', { ascending: false }).limit(10);

        if (!topProfiles || topProfiles.length === 0) {
          content.innerHTML = '<p style="font-size:11px; color:#aaa;">Ingen data tillgänglig.</p>';
          return;
        }

        let html = '<div>';
        topProfiles.forEach((p, idx) => {
          const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `${idx + 1}.`;
          html += `
            <div class="member-item">
              <span>${medal} ${p.full_name || 'Anonym'}</span>
              <span>⭐ Lvl ${p.level || 1} (${p.xp || 0} XP)</span>
            </div>
          `;
        });
        html += '</div>';
        content.innerHTML = html;

      } else if (activeTab === 'global-houses') {
        codeDisplay.innerText = '';
        const { data: households } = await db.from('households').select('*');
        const { data: members } = await db.from('household_members').select('household_id, user_id');
        const { data: profiles } = await db.from('profiles').select('id, xp');

        if (!households || households.length === 0) {
          content.innerHTML = '<p style="font-size:11px; color:#aaa;">Inga hem registrerade ännu.</p>';
          return;
        }

        const houseList = households.map(h => {
          const hMembers = members ? members.filter(m => m.household_id === h.id) : [];
          let totalXp = 0;
          hMembers.forEach(m => {
            const p = profiles ? profiles.find(pr => pr.id === m.user_id) : null;
            if (p) totalXp += (p.xp || 0);
          });
          return { name: h.name, totalXp, membersCount: hMembers.length };
        });

        houseList.sort((a, b) => b.totalXp - a.totalXp);
        const topHouses = houseList.slice(0, 5);

        let html = '<div>';
        topHouses.forEach((h, idx) => {
          const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `${idx + 1}.`;
          html += `
            <div class="member-item">
              <span>${medal} ${h.name} (${h.membersCount} st)</span>
              <span>✨ ${h.totalXp} XP</span>
            </div>
          `;
        });
        html += '</div>';
        content.innerHTML = html;
      }
    }

    async function createHouse() {
      const input = document.getElementById('new-house-name');
      const name = input.value.trim();
      if (!name) return;

      const { error } = await db.rpc('create_household', { h_name: name });
      if (error) alert('Fel: ' + error.message);
      else renderLeaderboard();
    }

    async function joinHouse() {
      const input = document.getElementById('join-house-code');
      const code = input.value.trim();
      if (!code) return;

      const { error } = await db.rpc('join_household', { p_code: code });
      if (error) alert('Fel: ' + error.message);
      else renderLeaderboard();
    }

    async function loadHabits(userId) {
      const { data: habits, error } = await db.rpc('get_user_quests', { p_user_id: userId });
      
      const todayStart = new Date();
      todayStart.setHours(0,0,0,0);

      const { data: todayLogs } = await db.from('habit_logs')
        .select('habit_id')
        .eq('user_id', userId)
        .gte('completed_at', todayStart.toISOString());

      const completedHabitIds = new Set(todayLogs ? todayLogs.map(l => l.habit_id) : []);
      const container = document.getElementById('habits-container');
      
      if (!habits || habits.length === 0) {
        container.innerHTML = '<p>Inga utmaningar tillgängliga.</p>';
        return;
      }

      container.innerHTML = '';

      const sections = [
        { key: 'core', label: '📌 Dagliga Rutiner (Core)', filter: h => h.is_core && h.quest_type === 'daily' },
        { key: 'side', label: '🎲 Dagens Side Quests (Random)', filter: h => !h.is_core && h.quest_type === 'daily' },
        { key: 'weekly', label: '⚔️ Veckoboss (Weekly)', filter: h => h.quest_type === 'weekly' },
        { key: 'monthly', label: '👑 Månadsboss (Monthly)', filter: h => h.quest_type === 'monthly' }
      ];

      sections.forEach(sec => {
        const secHabits = habits.filter(sec.filter);
        if (secHabits.length > 0) {
          const titleDiv = document.createElement('div');
          titleDiv.className = 'section-title';
          titleDiv.innerText = sec.label;
          container.appendChild(titleDiv);

          secHabits.forEach(habit => {
            const isDoneToday = completedHabitIds.has(habit.id);
            const div = document.createElement('div');
            div.className = 'habit-item';
            div.innerHTML = `
              <span>${habit.title} (+${habit.xp_reward} XP / +${habit.coin_reward} 💰)</span>
              ${isDoneToday 
                ? `<button class="complete-btn disabled-btn" disabled>Klar för idag! ✅</button>`
                : `<button class="complete-btn" onclick="claimRewards('${habit.id}')">Klar!</button>`
              }
            `;
            container.appendChild(div);
          });
        }
      });
    }

    async function claimRewards(habitId) {
      const { data, error } = await db.rpc('claim_quest_reward', { p_habit_id: habitId });

      if (error) {
        alert('Fel: ' + error.message);
      } else {
        updateXpBar(data.xp, data.level);
        document.getElementById('user-coins').innerText = data.coins;
        document.getElementById('user-streak').innerText = data.streak;
        
        currentUserProfile.xp = data.xp;
        currentUserProfile.coins = data.coins;
        currentUserProfile.level = data.level;
        currentUserProfile.current_month_xp = data.month_xp;
        currentUserProfile.inventory = data.inventory;

        renderInventory(data.inventory);
        loadHabits(currentUser.id);
        renderLeaderboard();
        renderNodesOnMap();
        renderCloudieOnNode(data.map_node || 1);
      }
    }

    async function checkUser() {
      const { data: { session } } = await db.auth.getSession();
      
      if (session) {
        currentUser = session.user;
        document.getElementById('login-card').style.display = 'none';
        document.getElementById('map-viewport').style.display = 'block';
        document.getElementById('dashboard').style.display = 'block';

        initMapPanZoom();

        let { data: profile } = await db.from('profiles').select('*').eq('id', session.user.id).maybeSingle();

        if (!profile) {
          const userRole = (session.user.email && session.user.email.toLowerCase() === 'benalvida@gmail.com') ? 'admin' : 'user';
          const newProfile = {
            id: session.user.id,
            full_name: session.user.user_metadata.full_name || 'Användare',
            xp: 0,
            level: 1,
            coins: 0,
            streak_count: 0,
            current_month_xp: 0,
            map_node: 1,
            inventory: [],
            role: userRole
          };

          await db.from('profiles').upsert(newProfile);
          profile = newProfile;
        } else if (session.user.email && session.user.email.toLowerCase() === 'benalvida@gmail.com' && profile.role !== 'admin') {
          await db.from('profiles').update({ role: 'admin' }).eq('id', session.user.id);
          profile.role = 'admin';
        }

        currentUserProfile = profile;
        document.getElementById('user-name').innerText = 'Hej ' + profile.full_name + '!';
        document.getElementById('user-coins').innerText = profile.coins || 0;
        document.getElementById('user-streak').innerText = profile.streak_count || 0;
        updateXpBar(profile.xp || 0, profile.level || 1);
        renderInventory(profile.inventory || []);

        if (profile.role === 'admin') {
          document.getElementById('admin-link-btn').style.display = 'block';
        }

        loadActiveMapAndPosition(profile.map_node || 1);

        renderLeaderboard();
        loadHabits(session.user.id);
      }
    }

    checkUser();
  </script>
</body>
</html>
