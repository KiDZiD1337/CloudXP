<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudXP</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #121212; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 1rem; }
    .card { background: #1e1e1e; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); text-align: center; max-width: 450px; width: 100%; box-sizing: border-box; }
    button { background-color: #4285F4; color: white; border: none; padding: 10px 18px; font-size: 15px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
    button:hover { background-color: #357ae8; }
    .profile-info { display: none; }
    .stats-bar { display: flex; justify-content: space-around; background: #2a2a2a; padding: 12px; border-radius: 8px; margin-top: 1rem; font-weight: bold; font-size: 14px; }
    .habit-list { text-align: left; margin-top: 1.5rem; }
    .habit-item { background: #2a2a2a; padding: 12px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .complete-btn { background-color: #2e7d32; font-size: 13px; padding: 6px 12px; }
    .complete-btn:hover { background-color: #1b5e20; }
    .disabled-btn { background-color: #444; color: #888; cursor: not-allowed; }
    .disabled-btn:hover { background-color: #444; }
    .admin-btn { display: none; background-color: #7b1fa2; margin-top: 1rem; width: 100%; }
    .admin-btn:hover { background-color: #6a1b9a; }
  </style>
</head>
<body>

  <div class="card">
    <h1>CloudXP 🎮</h1>
    <p id="status-text">Logga in för att påbörja ditt äventyr.</p>
    <button id="login-btn">Logga in med Google</button>
    
    <div id="profile" class="profile-info">
      <h2 id="user-name">Välkommen!</h2>
      
      <div class="stats-bar">
        <span>⭐ Lvl <span id="user-level">1</span></span>
        <span>✨ <span id="user-xp">0</span> XP</span>
        <span>💰 <span id="user-coins">0</span> Coins</span>
      </div>

      <div class="habit-list">
        <h3>Dagens Utmaningar</h3>
        <div id="habits-container">Laddar utmaningar...</div>
      </div>

      <button id="admin-link-btn" class="admin-btn" onclick="window.location.href='admin.html'">⚙️ Admin Panel</button>
      <button id="logout-btn" style="background-color: #e53935; margin-top: 1.5rem;">Logga ut</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://phhglvauynccbcpdnjqw.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_ASdxmwP7tzMXRtprVoaM2w_1maNYHQG'; 

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentUser = null;
    let currentXp = 0;
    let currentCoins = 0;

    document.getElementById('login-btn').addEventListener('click', async () => {
      const { error } = await db.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin }
      });
      if (error) alert('Fel: ' + error.message);
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await db.auth.signOut();
      window.location.reload();
    });

    async function loadHabits(userId) {
      const { data: habits } = await db.from('habits').select('*').eq('user_id', userId);
      
      // Hämta loggar gjorda idag
      const todayStart = new Date();
      todayStart.setHours(0,0,0,0);

      const { data: todayLogs } = await db.from('habit_logs')
        .select('habit_id')
        .eq('user_id', userId)
        .gte('completed_at', todayStart.toISOString());

      const completedHabitIds = new Set(todayLogs ? todayLogs.map(l => l.habit_id) : []);

      const container = document.getElementById('habits-container');
      
      if (!habits || habits.length === 0) {
        container.innerHTML = '<p>Inga utmaningar tillgängliga.</p>';
        return;
      }

      container.innerHTML = '';
      habits.forEach(habit => {
        const isDoneToday = completedHabitIds.has(habit.id);
        const div = document.createElement('div');
        div.className = 'habit-item';
        div.innerHTML = `
          <span>${habit.title} (+${habit.xp_reward} XP / +${habit.coin_reward} 💰)</span>
          ${isDoneToday 
            ? `<button class="complete-btn disabled-btn" disabled>Klaridag! ✅</button>`
            : `<button class="complete-btn" onclick="claimRewards('${habit.id}', ${habit.xp_reward}, ${habit.coin_reward})">Klar!</button>`
          }
        `;
        container.appendChild(div);
      });
    }

    async function claimRewards(habitId, xpAmount, coinAmount) {
      currentXp += xpAmount;
      currentCoins += coinAmount;
      const newLevel = Math.floor(currentXp / 100) + 1;

      document.getElementById('user-xp').innerText = currentXp;
      document.getElementById('user-coins').innerText = currentCoins;
      document.getElementById('user-level').innerText = newLevel;

      await db.from('profiles').update({ xp: currentXp, coins: currentCoins, level: newLevel }).eq('id', currentUser.id);
      await db.from('habit_logs').insert({ user_id: currentUser.id, habit_id: habitId });

      loadHabits(currentUser.id);
    }

    async function checkUser() {
      const { data: { session } } = await db.auth.getSession();
      
      if (session) {
        currentUser = session.user;
        document.getElementById('login-btn').style.display = 'none';
        document.getElementById('status-text').style.display = 'none';
        document.getElementById('profile').style.display = 'block';

        const { data: profile } = await db.from('profiles').select('full_name, xp, level, coins, role').eq('id', session.user.id).single();

        if (profile) {
          currentXp = profile.xp || 0;
          currentCoins = profile.coins || 0;
          document.getElementById('user-name').innerText = 'Hej ' + profile.full_name + '!';
          document.getElementById('user-xp').innerText = currentXp;
          document.getElementById('user-coins').innerText = currentCoins;
          document.getElementById('user-level').innerText = profile.level || 1;

          if (profile.role === 'admin') {
            document.getElementById('admin-link-btn').style.display = 'block';
          }
        }

        loadHabits(session.user.id);
      }
    }

    checkUser();
  </script>
</body>
</html>
