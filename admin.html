<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudXP - Admin CRM</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #121212; color: #ffffff; padding: 2rem; margin: 0; }
    .container { max-width: 1000px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid #333; padding-bottom: 1rem; }
    h1 { margin: 0; }
    .back-btn { background: #333; color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-size: 14px; }
    .back-btn:hover { background: #444; }
    table { width: 100%; border-collapse: collapse; background: #1e1e1e; border-radius: 8px; overflow: hidden; margin-top: 1rem; }
    th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #2a2a2a; }
    th { background: #2a2a2a; font-weight: 600; color: #aaa; }
    tr:hover { background: #252525; }
    .badge { background: #2e7d32; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
    .badge-user { background: #1565c0; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Admin CRM 📊</h1>
      <a href="index.html" class="back-btn">← Tillbaka till appen</a>
    </header>

    <div id="access-denied" style="display: none; color: #e53935;">
      <h2>Åtkomst nekad</h2>
      <p>Du har inte administratörsrättigheter för att se denna sida.</p>
    </div>

    <div id="admin-content" style="display: none;">
      <h2>Användaröversikt</h2>
      <table>
        <thead>
          <tr>
            <th>Namn</th>
            <th>Roll</th>
            <th>Nivå (Level)</th>
            <th>Total XP</th>
            <th>Slutförda vanor</th>
          </tr>
        </thead>
        <tbody id="user-table-body">
          <tr><td colspan="5">Laddar användare...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://phhglvauynccbcpdnjqw.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_ASdxmwP7tzMXRtprVoaM2w_1maNYHQG'; 
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function initAdmin() {
      const { data: { session } } = await db.auth.getSession();

      if (!session) {
        window.location.href = 'index.html';
        return;
      }

      // Kontrollera om inloggad användare är admin
      const { data: profile } = await db
        .from('profiles')
        .select('role')
        .eq('id', session.user.id)
        .single();

      if (!profile || profile.role !== 'admin') {
        document.getElementById('access-denied').style.display = 'block';
        return;
      }

      document.getElementById('admin-content').style.display = 'block';
      loadCrmData();
    }

    async function loadCrmData() {
      // Hämtar alla profiler
      const { data: profiles } = await db.from('profiles').select('*');
      // Hämtar alla loggar för att räkna aktivitet
      const { data: logs } = await db.from('habit_logs').select('user_id');

      const tbody = document.getElementById('user-table-body');
      tbody.innerHTML = '';

      if (!profiles || profiles.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5">Inga användare hittades.</td></tr>';
        return;
      }

      profiles.forEach(p => {
        // Räkna antal utförda vanor per användare
        const completedCount = logs ? logs.filter(log => log.user_id === p.id).length : 0;
        
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${p.full_name || 'Anonym'}</strong></td>
          <td><span class="badge ${p.role === 'admin' ? '' : 'badge-user'}">${p.role || 'user'}</span></td>
          <td>Level ${p.level}</td>
          <td>${p.xp} XP</td>
          <td>${completedCount} st</td>
        `;
        tbody.appendChild(tr);
      });
    }

    initAdmin();
  </script>
</body>
</html>
